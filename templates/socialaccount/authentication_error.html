{% extends "base.html" %}

{% block title %}Não foi possível entrar | Minha Rotina{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="card auth-card">
        <div class="card-body p-4 p-md-5 text-center">

            <div class="auth-logo auth-logo-error">
                <i class="bi bi-exclamation-lg"></i>
            </div>

            <h1 class="h4 fw-bold">
                Não conseguimos concluir o login
            </h1>

            <p class="text-muted-custom">
                Houve um problema ao autenticar sua conta Google.
                Verifique a configuração e tente novamente.
            </p>

            <a
                href="{% url 'login' %}"
                class="btn btn-primary w-100 mt-3"
            >
                Voltar para o login
            </a>

        </div>
    </div>

</div>

{% endblock %}
