<style>
.wizard-habilidade-row {padding: 8px 10px; border-radius: 12px; background: #fafbff; border: 1px solid #e8ebf3;}
.wizard-habilidade-name strong {font-size: .88rem;}
.wizard-habilidade-name {margin-bottom: 5px;}
.wizard-habilidade-intensidade button {min-width: 34px; min-height: 32px; border-radius: 9px; font-size: .82rem; font-weight: 700;}
.wizard-habilidades-grid, .wizard-skills-grid {gap: 9px 12px;}
</style>
<div class="wizard-skills">
    <div class="wizard-section-title">
        <h2>Habilidades</h2>
        <span>Preenchidas automaticamente ao escolher uma tarefa.</span>
    </div>

    <div class="wizard-skills-grid">
        {% for item in skills_disponiveis %}
            <div
                class="wizard-habilidade-row"
                data-habilidade-card="{{ item.habilidade.id }}"
            >
                <input
                    type="hidden"
                    name="habilidade_intensidade_{{ item.habilidade.id }}"
                    id="habilidade-intensidade-{{ item.habilidade.id }}"
                    value="{{ item.intensidade }}"
                >

                <div class="wizard-habilidade-name">
                    <span>{{ item.habilidade.icone }}</span>
                    <strong>{{ item.habilidade.nome }}</strong>
                </div>

                <div
                    class="habilidade-intensidade-options wizard-habilidade-intensidade"
                    data-habilidade-id="{{ item.habilidade.id }}"
                >
                    <button
                        type="button"
                        data-intensidade="0"
                        class="{% if item.intensidade == 0 %}active{% endif %}"
                        title="Sem associação"
                        aria-label="Sem associação"
                    >—</button>
                    <button
                        type="button"
                        data-intensidade="1"
                        class="{% if item.intensidade == 1 %}active{% endif %}"
                        title="Intensidade baixa"
                        aria-label="Intensidade baixa"
                    >1</button>
                    <button
                        type="button"
                        data-intensidade="2"
                        class="{% if item.intensidade == 2 %}active{% endif %}"
                        title="Intensidade média"
                        aria-label="Intensidade média"
                    >2</button>
                    <button
                        type="button"
                        data-intensidade="3"
                        class="{% if item.intensidade == 3 %}active{% endif %}"
                        title="Intensidade alta"
                        aria-label="Intensidade alta"
                    >3</button>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
