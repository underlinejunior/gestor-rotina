<div
    id="pwa-install-banner"
    class="pwa-install-banner d-none"
    role="dialog"
    aria-live="polite"
>
    <button
        type="button"
        class="pwa-install-close"
        id="pwa-install-close"
        aria-label="Fechar"
    >
        <i class="bi bi-x-lg"></i>
    </button>

    <div class="pwa-install-icon">
        <img
            src="/static/img/icons/app-icon-192.png"
            alt=""
        >
    </div>

    <div class="pwa-install-content">
        <strong>
            Instalar Rotina Conecta
        </strong>

        <span id="pwa-install-text">
            Use o aplicativo em tela cheia direto da tela inicial.
        </span>
    </div>

    <button
        type="button"
        class="btn btn-primary pwa-install-button"
        id="pwa-install-button"
    >
        Instalar
    </button>
</div>


<div
    id="pwa-ios-help"
    class="pwa-ios-help d-none"
    role="dialog"
    aria-live="polite"
>
    <button
        type="button"
        class="pwa-install-close"
        id="pwa-ios-close"
        aria-label="Fechar"
    >
        <i class="bi bi-x-lg"></i>
    </button>

    <div class="pwa-install-icon">
        <img
            src="/static/img/icons/app-icon-192.png"
            alt=""
        >
    </div>

    <div class="pwa-install-content">
        <strong>
            Instalar no iPhone/iPad
        </strong>

        <span>
            No Safari, toque em
            <b>Compartilhar</b>
            e depois em
            <b>Adicionar à Tela de Início</b>.
        </span>
    </div>
</div>
