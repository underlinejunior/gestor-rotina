{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#4f46e5">
    <meta name="color-scheme" content="light">
    <meta name="application-name" content="Rotina Conecta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rotina Conecta">
    <meta name="mobile-web-app-capable" content="yes">

    <title>{% block title %}Rotina Conecta{% endblock %}</title>

    <link
        rel="manifest"
        href="{% static 'manifest.webmanifest' %}"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="{% static 'img/icons/app-icon-180.png' %}"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="{% static 'img/icons/app-icon-192.png' %}"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}?v=20260924-delivery"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="{% static 'js/app.js' %}?v=20260924-delivery"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
